# clock
set-window-option -g clock-mode-colour green #green

# Enable mouse (wheel scroll, pane resize/select by click)
set -g mouse on

# Forward focus in/out events to programs running in panes. Claude Code uses
# this to tell whether the pane is focused, so it knows when to fire a
# desktop notification vs. assume you're already watching the terminal.
set -g focus-events on

# Name the window after the Claude Code session, not the binary.
#
# Claude Code publishes its session name (the /rename title, or the auto-generated
# topic title) as the pane title via an OSC escape, so it already shows up in
# #{pane_title}. What it can't do is set the tmux *window* name -- allow-rename is
# off, so automatic-rename falls back to #{pane_current_command}, which for Claude
# is the version-named binary (e.g. "2.1.251"). This format uses the pane title
# instead for panes running Claude, and leaves every other program alone.
#
# The leading status glyph is stripped and the result capped at 24 chars with an
# ellipsis. Windows renamed by hand keep their name until you run:
#   tmux setw -u automatic-rename
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{||:#{m:claude,#{pane_current_command}},#{m:[0-9].[0-9]*,#{pane_current_command}}},#{=/24/…:#{s|^✳ ||:pane_title}},#{pane_current_command}}}#{?pane_dead,[dead],}"

# Window list: inactive entries dimmed whole (index, colon and name alike), pale
# green block for the active window.
#
# #W is the Claude session name (see automatic-rename-format above). The whole
# inactive entry shares one dim colour so it reads as a single unit rather than
# a black index against a grey name.
#
# window_flags normally renders "*" for the active window and "-" for the last
# one; both are stripped -- the active window is already obvious from the styling
# below, and the last window needs no marker. What survives is Z (zoomed, shown
# as "+"), ! (bell) and # (activity), each sitting flush against the name -- and
# for the active window, inside the highlighted block rather than after it. The
# flag is spaced off the name, and absent entirely when there is no flag.
#
# The two colours live in user options so they can be tried out live without
# pasting the whole format back:
#
#   tmux set -g @win-fg colour233        # dim entries, darker
#   tmux set -g @win-current-bg colour22 # active block, darker
#
# A #{...} inside a #[...] works because tmux expands the format first and only
# then parses the style tags, so the option value is already substituted by the
# time #[fg=...] is read.
#
# @win-fg is the whole dimmed entry -- index, colon and name share one colour so
# it reads as a single unit rather than a black index against a grey name. The
# bar is bg=green, so *darker* is the high-contrast direction; lighter shades
# wash out against it. Rough contrast against the bar: 239 = 3.9:1 (muddy),
# 237 = 5.8:1, 236 = 7:1, 233 = 8.7:1, 16 = 9.7:1 (as loud as #S on the left).
set -g @win-fg colour236
set -g window-status-format         '#[fg=#{@win-fg}]#I:#W#{?#{s|Z|+|:#{s|[-*]||:window_flags}}, #{s|Z|+|:#{s|[-*]||:window_flags}},}#[default] '
#
# The active window is a block in a paler green than the bar's own bg=green, so
# it lifts off the bar instead of inverting into the terminal's background (a
# #[reverse] block goes black, which just blends into the terminal). Tune the
# shade: 194 = palest, 157 = pale, 151 = muted/greyer, 120 = most saturated.
# Going the other way -- a dark block with the pale green as fg -- separates far
# harder from the bar: 22 = dark green, 16 = black (pair either with
# fg=colour120 by swapping the two #[...] values below).
# The padding spaces sit inside the block so it has breathing room.
set -g @win-current-bg colour120
set -g window-status-current-format '#[bg=#{@win-current-bg}]#[fg=colour16]#[bold] #I:#W#{?#{s|Z|+|:#{s|[-*]||:window_flags}}, #{s|Z|+|:#{s|[-*]||:window_flags}},} #[default] '

# Tree mode (prefix + w / prefix + s): the session/window/pane chooser.
#
# tmux draws the left part of each line itself -- the shortcut key in brackets,
# the tree lines, the +/- expand marker and then the item's own name (session
# name, or window/pane index). None of that is styleable. Everything *after*
# the "name: " comes from -F, so that is where the colour goes, and repeating
# the name there would just duplicate what tmux already printed.
#
# The format has three branches, picked with the pane_format/window_format
# flags that tell you which tier of the tree the line belongs to:
#
#   session   ▌ 3  ● attached  30 Aug 22:49
#   window    editor *Z  2 panes
#   pane      zsh ●  100×31  dot-files
#
# Because the session name itself is one of the cells tmux draws, it cannot be
# bolded or coloured -- it always lands in the terminal's default foreground.
# So the session *row* carries the emphasis instead: an accent bar in
# @tree-session-fg, then its bare window count in bold white, which is the
# brightest thing in the tree. Window names are deliberately a step down
# (plain colour250, not bold) and panes a step down again, so the three tiers
# read as a hierarchy with the session on top rather than the window names
# shouting loudest.
#
# Tunable live, same convention as @win-fg above:
#
#   tmux set -g @tree-session-fg colour141   # violet accent bar
#
# Notes on the individual pieces:
#   - Green ● is "this is the live one" -- attached session, active pane --
#     matching the pale green used for the current window in the status bar.
#   - Window names tint amber on activity and red on a bell, so a window that
#     wants attention is visible without hunting for the flag character.
#   - window_flags drops "-" (last window) but keeps "*" (the session's current
#     window), which is worth seeing here, plus Z/!/# -- and unlike the status
#     bar the flags get a space so they don't run into the name.
#   - Panes end in #{pane_title} when a program has set one (Claude Code
#     publishes its session name there, see automatic-rename-format above),
#     otherwise the basename of the pane's cwd. A pane_title equal to #{host}
#     is the untouched default, i.e. "nothing set it".
#
# Kept in a user option so both bindings share it; #{E:...} expands the option
# and then expands the format inside it, which a bare #{@tree-format} won't do.
#
# Commas inside #[...] would be read as branch separators by #{?...}, hence the
# separate #[fg=...]#[bold] tags instead of #[fg=...,bold].
set -g @tree-session-fg colour81
set -g @tree-format '#{?pane_format,#{?pane_marked,#[reverse],}#[fg=colour215]#{pane_current_command}#{?pane_marked,#[noreverse],}#{?pane_active,#[fg=colour120] ●,}#[fg=colour240]  #{pane_width}×#{pane_height}  #{?#{==:#{pane_title},#{host}},#[fg=colour244]#{b:pane_current_path},#[fg=colour110]#{=/32/…:pane_title}},#{?window_format,#{?window_marked_flag,#[reverse],}#{?window_bell_flag,#[fg=colour203],#{?window_activity_flag,#[fg=colour222],#[fg=colour250]}}#{window_name}#{?window_marked_flag,#[noreverse],}#{?#{s|-||:window_flags},#[fg=colour215] #{s|-||:window_flags},}#{?#{==:#{window_panes},1},,#[fg=colour240]  #{window_panes} panes},#[fg=#{@tree-session-fg}]▌#[fg=colour231]#[bold] #{session_windows}#[nobold]#{?session_grouped,#[fg=colour140]  group #{session_group},}#{?session_attached,#[fg=colour120]  ● attached,}#[fg=colour240]  #{t/f/%-d %b %H#:%M:session_activity}}}'

bind w choose-tree -Zw -F '#{E:@tree-format}'
bind s choose-tree -Zs -F '#{E:@tree-format}'

# Selected line in tree mode (and the selection in copy mode). The default
# bg=yellow,fg=black would fight the per-item colours above, since a #[fg=...]
# in the format overrides the fg of this style but not its bg. A dark grey band
# leaves every colour readable and still marks the row; the fg only shows on
# the tmux-drawn prefix, which brightens the selected item's name.
# For a greener highlight matching the status bar, try bg=colour22.
set -g mode-style 'fg=colour231,bg=colour238'

# Copy-mode selection. This defaults to "#{E:mode-style}", i.e. it inherits
# whatever mode-style is -- so setting the dark band above also greyed out the
# copy-mode selection. Setting it explicitly decouples the two: tree mode keeps
# the neutral band, copy mode keeps a warm highlight.
#
# colour230 (#ffffd7) is a cream wash, much paler than the old bg=yellow,
# which most terminals render as a fairly saturated mustard. If it needs more
# colour: 229 = pale yellow, 228 = a touch more saturated, 223 = pale apricot,
# 222 = light amber, 187 = muted khaki.
#
# fg=colour16 for the same reason as status-left below: it is true black,
# where plain "black" (ANSI colour0) gets brightened to grey by some terminals.
set -g copy-mode-selection-style 'fg=colour16,bg=colour230'

# Status right: clock only. The default includes #{=21:pane_title}, which under
# the automatic-rename-format above is the Claude session name -- redundant with
# the window list, so it is dropped.
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}%H:%M %d-%b-%y'

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L # Select the pane to the left
bind j select-pane -D # Select the pane below
bind k select-pane -U # Select the pane above
bind l select-pane -R # Select the pane to the right

bind C-h resize-pane -L 5
bind C-j resize-pane -D 5
bind C-k resize-pane -U 5
bind C-l resize-pane -R 5

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -i -sel c"

# # Status Right (Spotify Plugin)
# set -g status-right-length 100
# set -g status-right "#(spotify status artist) #{music_status} #(spotify status track) | %a %d %h %H:%M "

# Status Left
set -g status-left-length 50
# fg=colour16 is pure #000000 from the 256-colour cube. Plain "black" is ANSI
# colour0, which most terminals brighten to grey when bold is set; colour16 is
# outside that 0-7 range, so it stays true black.
set -g status-left " #[fg=colour16,bold]#S#[default]  "

# TMUX Plugin Manager
#
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# https://github.com/tmux-plugins/tmux-sensible
set -g @plugin 'tmux-plugins/tmux-sensible'
# # Spotify
# set -g @plugin 'chochkov/tmux-spotify'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
